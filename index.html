<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#080b0e" />
  <meta name="color-scheme" content="dark light" />
  <title>neetprep · NEET Study Platform</title>
  <script>
    (function () {
      // Keep the browser viewport as the single vertical scroll owner.
      // StudentShell/WebsiteScrollShell previously turned body, #root and
      // route shells into nested scroll containers, which can trap touch scroll
      // on mobile while still appearing to work with a desktop mouse wheel.
      function normalizeScroll() {
        var html = document.documentElement;
        var body = document.body;
        var root = document.getElementById('root');
        var app = document.querySelector('.app');
        var site = document.querySelector('.np-site');
        var student = document.querySelector('.student-v7');

        html.style.setProperty('height', 'auto', 'important');
        html.style.setProperty('min-height', '100%', 'important');
        html.style.setProperty('overflow-y', 'auto', 'important');
        html.style.setProperty('overflow-x', 'hidden', 'important');
        html.style.setProperty('touch-action', 'pan-y', 'important');

        [body, root, app, site, student].forEach(function (el) {
          if (!el) return;
          el.style.setProperty('height', 'auto', 'important');
          el.style.setProperty('max-height', 'none', 'important');
          el.style.setProperty('overflow-y', 'visible', 'important');
          el.style.setProperty('overflow-x', 'hidden', 'important');
          el.style.setProperty('touch-action', 'pan-y', 'important');
        });

        if (student) {
          student.style.setProperty('display', 'block', 'important');
          var header = student.querySelector('.v7-top');
          if (header) {
            header.style.setProperty('display', 'flex', 'important');
            header.style.setProperty('visibility', 'visible', 'important');
            header.style.setProperty('opacity', '1', 'important');
          }
        }
      }

      // Run after React mounts and keep it stable against route/state changes.
      normalizeScroll();
      new MutationObserver(normalizeScroll).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
      setInterval(normalizeScroll, 250);
    })();
  </script>
  <link rel="stylesheet" href="/src/mobile-layout-fix.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
